server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        name: SUPERVISE_SESSION
        http-only: true
        same-site: lax
        path: /

spring:
  application:
    name: supervise
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:supervise}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

supervise:
  timezone: Asia/Shanghai
  site-name: ${SITE_NAME:会议任务督办系统}
  scan:
    startup-catchup-enabled: ${SCAN_STARTUP_CATCHUP:true}
    cron: ${SCAN_CRON:0 0 9 * * *}
  dingtalk:
    corp-id: ${DINGTALK_CORP_ID:}
    agent-id: ${DINGTALK_AGENT_ID:}
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    api-base: ${DINGTALK_API_BASE:https://oapi.dingtalk.com}
    login-base: ${DINGTALK_LOGIN_BASE:https://login.dingtalk.com}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

logging:
  level:
    root: INFO
    com.pmo.supervise: INFO
