# 本地开发数据库（单实例）。应用本身用 ./mvnw spring-boot:run 启动。
services:
  mysql:
    image: mysql:8.0
    container_name: supervise-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: supervise
      MYSQL_USER: supervise
      MYSQL_PASSWORD: supervise
    ports:
      - "3306:3306"
    volumes:
      - supervise-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  supervise-mysql-data:
